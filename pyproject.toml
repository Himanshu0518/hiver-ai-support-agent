[project]
name = "hiver-ai-support-agent"
version = "0.1.0"
description = "AI-powered customer support agent for AmazonHelp using RAG, Gemini, and LangGraph"
requires-python = ">=3.11"
dependencies = [
    # Data processing
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    
    # Embeddings & Vector Store
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    
    # LLM - Google Gemini (primary)
    "google-generativeai>=0.5.0",
    
    # LLM - Groq (fast fallback)
    "groq>=0.11.0",
    
    # LangChain + LangGraph
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    
    # Pydantic for structured output & validation
    "pydantic>=2.0.0",
    
    # API (reserved for future FastAPI server)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    
    # Utilities
    "tqdm>=4.64.0",
    "regex>=2023.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
